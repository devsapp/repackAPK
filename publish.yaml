Edition: 3.0.0
Type: Project
Name: start-repack-apk-cap
Version: 0.0.2
Provider:
  - 阿里云
Description: 基于本案例，您可以快捷部署一个弹性高可用的“Serverless实现实时 APK 渠道分包”服务。该方案适用于大规模、多渠道的游戏分发场景，特别是在面临频繁且多变的下载请求时，能够通过系统实时获取并下载包含定制渠道号的游戏 APK 包，确保即使在连接不稳定的情况下也能顺利完成游戏的获取。
HomePage: https://github.com/devsapp/repackAPK/tree/dipper
Organization: 阿里云函数计算（FC）
Effective: Public
Tags:
  - apk 渠道游戏包实时打包
  - apk 渠道实时打包
  - 实时 apk 渠道分包
  - 计算任务
Category: 其它
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
  硬盘挂载:
    Authorities:
      - AliyunFCServerlessDevsRolePolicy
  专有网络:
    Authorities:
      - AliyunFCServerlessDevsRolePolicy
  日志服务: 
    Authorities: 
      - AliyunFCServerlessDevsRolePolicy
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
  properties:
    region:
      title: 地域
      type: string
      default: cn-hangzhou
      description: 创建应用所在的地区
      enum:
        - cn-beijing
        - cn-hangzhou
        - cn-shanghai
        - cn-qingdao
        - cn-zhangjiakou
        - cn-huhehaote
        - cn-shenzhen
        - cn-chengdu
        - cn-hongkong
        - ap-southeast-1
        - ap-southeast-2
        - ap-southeast-3
        - ap-southeast-5
        - ap-northeast-1
        - ap-northeast-2
        - eu-central-1
        - eu-west-1
        - us-west-1
        - us-east-1
        - ap-south-1
    functionName:
      title: 函数名
      type: string
      default: get-apk-${default-suffix}
      pattern: "^[a-zA-Z_][a-zA-Z0-9-_]{0,127}$"
      description: 应用的函数名称, 只能包含字母、数字、下划线和中划线。不能以数字、中划线开头。长度在 1-128 之间
